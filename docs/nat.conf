#
# 開発用 NAT ルール（Mac を親機のインターネット出口にする）
#   en0            : Wi-Fi（上流）
#   192.168.20.0/24: 親機との直結セグメント
#
# 適用（再起動で消える一時設定）:
#   sudo sysctl -w net.inet.ip.forwarding=1
#   sudo pfctl -f /path/to/nat.conf -E
#
# 解除:
#   sudo pfctl -d
#   sudo sysctl -w net.inet.ip.forwarding=0
#
nat on en0 inet from 192.168.20.0/24 to any -> (en0)

pass in all
pass out all
